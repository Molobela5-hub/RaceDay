name: .NET

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        configuration: [Debug, Release]

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Set up .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Restore solution
      run: dotnet restore RaceDay.slnx

    - name: Build solution
      run: dotnet build RaceDay.slnx --configuration ${{ matrix.configuration }} --no-restore

    - name: Run tests
      run: dotnet test RaceDay.slnx --configuration ${{ matrix.configuration }} --no-build
